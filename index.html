<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Bridge — Annaporna</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">💚</div>
        <div>
          <h2>Food Bridge</h2>
          <small>Connecting Communities</small>
        </div>
      </div>
      <nav class="nav" id="navLinks">
        <a href="#home" data-link>Community Map</a>
        <a href="#request" data-link>Request Food</a>
        <a href="#browse" data-link>Browse Requests</a>
        <a href="#profile" data-link>My Profile</a>
      </nav>
      <div class="quick-actions" id="quickActions"></div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header class="topbar">
        <h1 id="pageTitle">Food Bridge</h1>
        <div id="userSummary" class="user-summary"></div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="main.js"></script>
</body>
</html>
